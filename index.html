<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="description" content="DJ RegoN — official social links" />
  <title>DJ RegoN</title>
  <style>
    :root{--bg:#05070b;--card:rgba(12,16,24,.72);--line:rgba(255,255,255,.16);--text:#fff;--muted:#b9c2d3;--glow:#5dd8ff}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    body{min-height:100svh;display:grid;place-items:center;padding:24px 16px;overflow-x:hidden;position:relative}
    body:before{content:"";position:fixed;inset:0;background:
      radial-gradient(circle at 18% 18%,rgba(50,190,255,.16),transparent 34%),
      radial-gradient(circle at 82% 78%,rgba(130,70,255,.16),transparent 38%),
      linear-gradient(135deg,#030509 0%,#0a111c 48%,#04060a 100%);z-index:-3}
    body:after{content:"";position:fixed;inset:-20%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px);transform:rotate(-3deg);z-index:-2;pointer-events:none}
    .wrap{width:min(100%,430px)}
    .card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:var(--card);box-shadow:0 30px 80px rgba(0,0,0,.55);backdrop-filter:blur(18px)}
    .hero{height:360px;position:relative;background:#0b1018}
    .hero img{width:100%;height:100%;object-fit:cover;object-position:58% 36%;display:block;filter:saturate(.92) contrast(1.04)}
    .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(5,7,11,.18) 66%,#070a10 100%)}
    .tag{position:absolute;top:18px;left:18px;z-index:2;padding:8px 12px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(10px);font-size:12px;letter-spacing:.15em;text-transform:uppercase}
    .content{position:relative;margin-top:-42px;padding:0 22px 24px;z-index:3;text-align:center}
    .name{font-size:42px;line-height:.95;margin:0;font-weight:900;letter-spacing:-.05em;text-shadow:0 3px 28px rgba(0,0,0,.5)}
    .role{margin:10px 0 22px;color:var(--muted);font-size:14px;letter-spacing:.2em;text-transform:uppercase}
    .links{display:grid;gap:12px}
    .btn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;min-height:58px;padding:14px 18px;border:1px solid rgba(255,255,255,.16);border-radius:18px;color:#fff;text-decoration:none;font-weight:800;font-size:16px;letter-spacing:.01em;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));transition:transform .18s ease,border-color .18s ease,background .18s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
    .btn:active{transform:scale(.985)} .btn:hover{border-color:rgba(93,216,255,.5);background:linear-gradient(180deg,rgba(93,216,255,.15),rgba(255,255,255,.05))}
    .btn svg{width:23px;height:23px;flex:0 0 auto;fill:currentColor}
    .footer{margin-top:20px;font-size:11px;color:#7e8aa0;letter-spacing:.12em;text-transform:uppercase}
    .shine{position:absolute;inset:auto -30% -32% 25%;height:220px;background:radial-gradient(circle,rgba(93,216,255,.17),transparent 66%);filter:blur(16px);pointer-events:none}
    @media (max-width:370px){.hero{height:320px}.name{font-size:37px}.content{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="DJ RegoN social links">
      <div class="hero">
        <img src="regon.webp" alt="DJ RegoN" />
        <div class="tag">Official Links</div>
      </div>
      <div class="content">
        <h1 class="name">DJ RegoN</h1>
        <p class="role">DJ • Performer</p>
        <div class="links">
          <a class="btn" href="https://www.instagram.com/dj_regon?stkn=MW9sZTZxYm5oYXFwNg==" target="_blank" rel="noopener noreferrer" aria-label="DJ RegoN on Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 2A3.76 3.76 0 0 0 4 7.75v8.5A3.76 3.76 0 0 0 7.75 20h8.5A3.76 3.76 0 0 0 20 16.25v-8.5A3.76 3.76 0 0 0 16.25 4h-8.5Zm8.75 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
            Instagram
          </a>
          <a class="btn" href="https://youtube.com/@dj_regon" target="_blank" rel="noopener noreferrer" aria-label="DJ RegoN on YouTube">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3.02 3.02 0 0 0-2.13-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.37.51A3.02 3.02 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3.02 3.02 0 0 0 2.13 2.14c1.87.51 9.37.51 9.37.51s7.5 0 9.37-.51a3.02 3.02 0 0 0 2.13-2.14A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8ZM9.6 15.65v-7.3L15.9 12 9.6 15.65Z"/></svg>
            YouTube
          </a>
          <a class="btn" href="https://www.tiktok.com/@djregon?_r=1&_t=ZN-9ADk16TAZtu" target="_blank" rel="noopener noreferrer" aria-label="DJ RegoN on TikTok">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.7 2c.38 2.2 1.67 3.52 3.8 3.66V9.1a9.65 9.65 0 0 1-3.77-.87v7.04c0 4.47-4.76 7.06-8.4 4.55-2.34-1.61-2.98-4.9-1.4-7.28a5.42 5.42 0 0 1 5.15-2.35v3.5a2.15 2.15 0 0 0-2.25 1.2 2.12 2.12 0 1 0 3.98.98V2h2.89Z"/></svg>
            TikTok
          </a>
        </div>
        <div class="footer">Tap • Follow • Listen</div>
      </div>
      <div class="shine"></div>
    </section>
  </main>
</body>
</html>
